name: Publish Helm chart to ECR

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/publish-chart.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CHART_DIR: charts/app-chart

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Learner Lab: credencial temporária
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names app-chart --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name app-chart --region "$AWS_REGION"

      - name: Resolve ECR host + chart version
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ecr_host=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Helm login to ECR (OCI)
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "${{ steps.meta.outputs.ecr_host }}"

      - name: Fail if version already published
        run: |
          if aws ecr describe-images \
               --repository-name app-chart \
               --image-ids imageTag=${{ steps.meta.outputs.version }} \
               --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Versão ${{ steps.meta.outputs.version }} já existe no ECR."
            echo "Suba a 'version:' no Chart.yaml antes de publicar."
            exit 1
          fi

      - name: Lint, package and push
        run: |
          helm lint "$CHART_DIR"
          helm package "$CHART_DIR"
          helm push app-chart-${{ steps.meta.outputs.version }}.tgz \
            oci://${{ steps.meta.outputs.ecr_host }}
