apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app-chart.labels" (dict "name" .Values.app.name "root" $) | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "app-chart.selectorLabels" (dict "name" .Values.app.name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
