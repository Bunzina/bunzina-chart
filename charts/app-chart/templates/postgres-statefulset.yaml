{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app-chart.labels" (dict "name" .Values.database.name "root" $) | nindent 4 }}
spec:
  serviceName: {{ .Values.database.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "app-chart.selectorLabels" (dict "name" .Values.database.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-chart.labels" (dict "name" .Values.database.name "root" $) | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.database.name }}
          image: {{ .Values.database.image }}
          ports:
            - name: {{ .Values.database.name }}
              containerPort: {{ .Values.database.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.database.name }}-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.database.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.storage }}
{{- end }}
