apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app-chart.labels" (dict "name" .Values.app.name "root" $) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.app.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
