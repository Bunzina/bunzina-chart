{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app-chart.labels" (dict "name" .Values.database.name "root" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "app-chart.selectorLabels" (dict "name" .Values.database.name) | nindent 4 }}
  ports:
    - name: {{ .Values.database.name }}
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
{{- end }}
